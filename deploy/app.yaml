apiVersion: v1
kind: Service
metadata:
  name: golang-template
spec:
  selector:
    app: golang-template
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang-template
spec:
  replicas: 1
  selector:
    matchLabels:
      app: golang-template
  template:
    metadata:
      labels:
        app: golang-template
    spec:
      initContainers:
        - name: migrate
          image: app
          args: ["-migrate-only"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: golang-template-db
                  key: DATABASE_URL
      containers:
        - name: golang-template
          image: app
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: HTTP_ADDR
              value: ":8081"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: golang-template-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
