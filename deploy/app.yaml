apiVersion: v1
kind: Service
metadata:
  name: golang-template
spec:
  selector:
    app: golang-template
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang-template
spec:
  replicas: 1
  selector:
    matchLabels:
      app: golang-template
  template:
    metadata:
      labels:
        app: golang-template
    spec:
      initContainers:
        - name: migrate
          image: app
          args: ["-migrate-only"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: golang-template-db
                  key: DATABASE_URL
      containers:
        - name: golang-template
          image: app
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - secretRef:
                name: golang-template-env
                optional: true
          env:
            - name: HTTP_ADDR
              value: ":8081"
            - name: APP_ENV
              value: homelab
            - name: ENVIRONMENT
              value: homelab
            - name: LOG_JSON
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: golang-template
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=homelab
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: signoz-k8s-infra-otel-agent.o11y.svc.cluster.local:4317
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: golang-template-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
