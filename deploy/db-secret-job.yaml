apiVersion: batch/v1
kind: Job
metadata:
  name: db-secret
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: db-secret
      restartPolicy: Never
      containers:
        - name: db-secret
          image: alpine/k8s:1.30.14
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              name="${POD_NAMESPACE}-db"
              if kubectl -n "$POD_NAMESPACE" get secret "$name" >/dev/null 2>&1; then
                exit 0
              fi
              pass=$(dd if=/dev/urandom bs=512 count=1 2>/dev/null | tr -dc 'A-Za-z0-9' | head -c 32)
              if [ "${#pass}" -ne 32 ]; then
                echo "password generation failed" >&2
                exit 1
              fi
              url="postgres://app:${pass}@${POD_NAMESPACE}-postgres:5432/app?sslmode=disable"
              kubectl -n "$POD_NAMESPACE" create secret generic "$name" \
                --from-literal=password="$pass" \
                --from-literal=DATABASE_URL="$url"
