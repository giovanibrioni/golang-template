apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-secret
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-secret
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: db-secret
subjects:
  - kind: ServiceAccount
    name: db-secret
