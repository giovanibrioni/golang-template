name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: homelab
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: OpenAPI
        run: |
          if ! command -v make >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then
              apt-get update && apt-get install -y make
            else
              sudo apt-get update && sudo apt-get install -y make
            fi
          fi
          make openapi
          git diff --exit-code -- openapi.yaml docs/swagger.yaml docs/swagger.json docs/docs.go
      - name: Test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test?sslmode=disable
        run: go test ./...

  deliver:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'pocs-dev-br'
    runs-on: homelab
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish
        run: |
          set -eu
          short=$(git rev-parse --short=7 HEAD)
          app=golang-template
          image="registry.registry.svc.cluster.local:5000/${app}:${short}"
          docker build -t "$image" .
          docker push "$image"
          token=$(cat /etc/homelab/infra-token)
          rm -rf /tmp/homelab-infra
          git clone "https://x-access-token:${token}@github.com/giovanibrioni/homelab-infra.git" /tmp/homelab-infra
          cd /tmp/homelab-infra
          git config user.name homelab-ci
          git config user.email homelab-ci@users.noreply.github.com
          if [ ! -f "apps/${app}/kustomization.yaml" ]; then
            mkdir -p "apps/${app}"
            cp -a "${GITHUB_WORKSPACE}/deploy/." "apps/${app}/"
          fi
          if [ -f "${GITHUB_WORKSPACE}/deploy/expose.yaml" ]; then
            mkdir -p "apps/${app}"
            cp "${GITHUB_WORKSPACE}/deploy/expose.yaml" "apps/${app}/expose.yaml"
          fi
          if [ -f "${GITHUB_WORKSPACE}/homelab.yaml" ]; then
            mkdir -p "apps/${app}"
            cp "${GITHUB_WORKSPACE}/homelab.yaml" "apps/${app}/homelab.yaml"
            python3 scripts/check-homelab.py
            python3 scripts/render-app.py --app "${app}"
          fi
          sed -i "s/newTag: .*/newTag: \"${short}\"/" "apps/${app}/kustomization.yaml"
          bash scripts/render-kong-expose.sh
          git add "apps/${app}" infrastructure/kong/deck/apps
          if ! git diff --cached --quiet; then
            git commit -m "deploy(${app}): ${short}"
            ok=0
            for _ in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                ok=1
                break
              fi
              sleep 2
            done
            test "$ok" = 1
          fi
          if [ ! -f "${GITHUB_WORKSPACE}/openapi.yaml" ]; then
            exit 0
          fi
          rm -rf /tmp/homelab-contracts
          git clone "https://x-access-token:${token}@github.com/giovanibrioni/homelab-contracts.git" /tmp/homelab-contracts
          cd /tmp/homelab-contracts
          git config user.name homelab-ci
          git config user.email homelab-ci@users.noreply.github.com
          mkdir -p "${app}"
          cp "${GITHUB_WORKSPACE}/openapi.yaml" "${app}/openapi.yaml"
          if [ -f "${GITHUB_WORKSPACE}/asyncapi.yaml" ]; then
            cp "${GITHUB_WORKSPACE}/asyncapi.yaml" "${app}/asyncapi.yaml"
          fi
          if [ -d "${GITHUB_WORKSPACE}/proto" ]; then
            rm -rf "${app}/proto"
            cp -a "${GITHUB_WORKSPACE}/proto" "${app}/proto"
          fi
          git add "${app}"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "contracts(${app}): ${short}"
          ok=0
          for _ in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
